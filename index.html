<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaConnect - Meeting Room Booker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <span class="navbar-brand header-brand h3">MediaConnect <span class="text-dark fw-light">| Room Booker</span></span>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-lg-8">
                <h4 class="mb-3">Select a Room & Time</h4>
                <div id="rooms-container" class="row g-4">
                </div>
            </div>
            <div class="col-lg-4 mt-4 mt-lg-0">
                <div class="summary-panel sticky-top" style="top: 20px;">
                    <h5 class="mb-3">Booking Summary</h5>
                    <form id="booking-form">
                        <div class="mb-3">
                            <label for="userName" class="form-label text-muted small">Your Name</label>
                            <input type="text" class="form-control" id="userName" placeholder="John Doe" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Selected Slot</label>
                            <div id="selection-display" class="p-2 bg-light rounded border text-center text-muted">
                                No slot selected
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2" id="bookBtn" disabled>Confirm Booking</button>
                    </form>
                    <div id="success-message" class="alert alert-success mt-3 d-none">
                        <strong>Success!</strong> Room booked.
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
    <script src="script.js"></script>
</body>
</html>
